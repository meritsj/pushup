<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="100">
<meta name="theme-color" content="#0F1D2A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>푸쉬업 100일</title>
<style>
:root{--bg:#0F1D2A;--surface:#17293A;--line:#25415A;--line2:#1D3348;
  --text:#E2ECF3;--muted:#7E97AC;--amber:#F0A33C;--sky:#79B4E6;--bad:#E0705F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);overscroll-behavior:none}
body{color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none}
#dawn{position:fixed;top:0;left:0;right:0;height:52vh;pointer-events:none;z-index:0;opacity:0;
  background:linear-gradient(180deg,rgba(240,163,60,.22),rgba(224,112,95,.10) 38%,rgba(121,180,230,.04) 62%,transparent);
  transition:opacity 1.4s ease}
#root{position:relative;z-index:1;max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 92px)}
.head{display:flex;align-items:flex-start;justify-content:space-between;padding:8px 0 14px}
.date{font-size:13px;color:var(--muted)}
.daylabel{font-size:30px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.mute{background:none;border:1px solid var(--line);color:var(--muted);font-size:12px;
  padding:7px 11px;border-radius:999px;font-family:inherit}
.err{padding:11px 13px;border-radius:10px;background:rgba(224,112,95,.13);
  border:1px solid rgba(224,112,95,.4);color:var(--bad);font-size:13px;line-height:1.5;margin-bottom:12px}
.gauge{margin-bottom:14px}
.gaugetop{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.gnum{font-size:34px;font-weight:300;letter-spacing:-.03em;line-height:1}
.gnum span{font-size:17px;color:var(--muted)}
.gsub{font-size:12px;color:var(--muted)}
.banner{background:rgba(121,180,230,.10);border:1px solid rgba(121,180,230,.32);color:var(--sky);
  border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;margin-bottom:12px}
.start{width:100%;background:var(--amber);color:#12212F;border:none;border-radius:16px;
  padding:22px;font-size:19px;font-weight:700;font-family:inherit;margin-bottom:14px}
.start i{display:block;font-style:normal;font-size:12px;font-weight:500;opacity:.75;margin-top:5px}
/* 자동 진행 화면 */
.auto{text-align:center;padding:6px 0 4px}
.aset{font-size:13px;color:var(--muted);letter-spacing:.02em}
.aname{font-size:27px;font-weight:650;letter-spacing:-.02em;margin:3px 0 16px}
.ringwrap{position:relative;width:212px;height:212px;margin:0 auto}
.ringwrap svg{transform:rotate(-90deg)}
.ringinner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:70px;font-weight:200;line-height:1;letter-spacing:-.05em}
.small{font-size:14px;color:var(--muted);margin-top:8px;letter-spacing:.04em}
.areps{font-size:32px;font-weight:300;margin:16px 0 4px;letter-spacing:-.02em}
.anext{font-size:13px;color:var(--muted);min-height:18px}
.actl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:22px}
.actl button{background:none;border:1.5px solid var(--line);color:var(--text);border-radius:12px;
  padding:15px 2px;font-size:14px;font-family:inherit}
.actl .go{background:var(--amber);border-color:var(--amber);color:#12212F;font-weight:600}
.timer{display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px 0 20px}
.ghost{background:none;border:none;color:var(--muted);font-size:14px;padding:8px 16px;
  font-family:inherit;text-decoration:underline;text-underline-offset:4px}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:16px;
  padding:16px 16px 17px;margin-bottom:12px}
.cardname{font-size:17px;font-weight:600;letter-spacing:-.01em}
.cardsub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.55}
.tagline{font-size:12px;color:var(--sky);margin-top:6px}
.run{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;
  font-family:inherit;color:inherit}
.check{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.check.on{background:var(--amber);border-color:var(--amber);color:#12212F}
.finish{border-color:var(--amber)}
.cum{margin-top:13px;padding-top:13px;border-top:1px solid var(--line2);font-size:14px;color:var(--amber)}
.minimal{width:100%;background:none;border:1px dashed var(--line);color:var(--muted);
  border-radius:14px;padding:16px;font-size:14px;font-family:inherit;margin-bottom:12px}
.addrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.addbtn{background:none;border:1.5px solid var(--line);color:var(--text);border-radius:11px;
  padding:14px 4px;font-size:15px;font-family:inherit}
.exhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.counter{font-size:26px;font-weight:400;line-height:1;flex:none;letter-spacing:-.02em}
.counter span{font-size:15px;color:var(--muted)}
.dots{display:flex;gap:7px;margin:15px 0 14px;flex-wrap:wrap}
.dot{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.dot.on{background:var(--amber);border-color:var(--amber);color:#12212F;font-weight:600}
.primary{background:var(--amber);color:#12212F;border:none;border-radius:12px;
  font-size:16px;font-weight:600;padding:16px 18px;font-family:inherit}
.primary:disabled{opacity:.35}
.wide{width:100%}
.rpelabel{font-size:13px;color:var(--muted);margin-bottom:9px}
.rperow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.rpebtn{background:none;border:1.5px solid var(--line);color:var(--text);border-radius:11px;
  padding:13px 2px;font-size:13px;font-family:inherit}
.sealed{font-size:13px;color:var(--muted)}
.test{border-color:var(--amber)}
.testrow{display:flex;gap:9px;margin-top:13px}
.num{flex:1;min-width:0;background:var(--bg);border:1.5px solid var(--line);color:var(--text);
  border-radius:12px;padding:14px 16px;font-size:22px;font-family:inherit;-webkit-user-select:text;user-select:text}
.restday{padding:36px 4px}
.restday-h{font-size:22px;font-weight:600}
.restday p{color:var(--muted);font-size:14px;line-height:1.6;margin-top:8px}
.hero{padding:20px 16px}
.heronum{font-size:52px;font-weight:300;line-height:1;letter-spacing:-.04em;margin:2px 0 4px}
.bar{height:6px;background:var(--line2);border-radius:99px;overflow:hidden}
.barfill{height:100%;background:var(--amber);border-radius:99px;transition:width .3s ease}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;
  padding-top:16px;border-top:1px solid var(--line2)}
.stats b{display:block;font-size:18px;font-weight:600}
.stats i{font-style:normal;font-size:11px;color:var(--muted);display:block;margin-top:3px}
.board{margin-top:15px;display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.cell{aspect-ratio:1;min-height:24px;border-radius:5px;border:1px solid var(--line2);
  background:rgba(255,255,255,.02);display:flex;align-items:center;justify-content:center}
.cell b{font-size:9px;font-weight:700;color:var(--muted)}
.cell.did{background:rgba(240,163,60,.78);border-color:rgba(240,163,60,.78)}
.cell.did b{color:#12212F}
.cell.skip{opacity:.4}
.cell.now{background:var(--sky);border-color:var(--sky)}
.cell.now b{color:#12212F}
.cell.mile{border-width:2px;border-color:var(--line)}
.cell.mile.did{border-color:var(--amber)}
.daybars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:14px}
.dbar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.dfill{width:100%;background:var(--amber);border-radius:3px 3px 0 0;min-height:2px}
.dbar i{font-style:normal;font-size:9px;color:var(--muted);margin-top:4px}
.trow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--line2)}
.trow:last-of-type{border-bottom:none}
.trow b{display:block;font-size:14px;font-weight:600;color:var(--muted)}
.trow i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:3px}
.trow.on b{color:var(--amber)}
.tright{text-align:right;flex:none}
.spark{width:100%;height:70px;margin-top:12px;overflow:visible}
.log{padding:14px 16px}
.logdate{font-size:13px;color:var(--muted);margin-bottom:9px}
.logrow{display:flex;align-items:center;gap:10px;font-size:14px;padding:5px 0}
.logrow span:first-child{flex:1}
.logval{color:var(--muted)}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.empty{color:var(--muted);font-size:14px;padding:28px 4px}
.std{margin:12px 0 0;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.75}
.note{font-size:13px;color:var(--muted);margin-top:13px;padding-top:13px;
  border-top:1px solid var(--line2);line-height:1.6}
.toggle{margin-top:10px;background:none;border:1.5px solid var(--line);color:var(--text);
  border-radius:11px;padding:13px 16px;font-size:14px;font-family:inherit;width:100%}
.toggle.on{border-color:var(--amber);color:var(--amber)}
.dump{width:100%;margin-top:10px;height:96px;background:var(--bg);border:1px solid var(--line);
  color:var(--muted);border-radius:10px;padding:10px;font-size:11px;font-family:ui-monospace,monospace;
  -webkit-user-select:text;user-select:text}
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;z-index:2;
  background:var(--bg);border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;background:none;border:none;color:var(--muted);font-size:14px;padding:16px 0 18px;font-family:inherit}
.tab.on{color:var(--amber)}
.fig{width:100%;max-width:250px;height:auto;display:block;margin:0 auto}
.fl{fill:none;stroke:var(--text);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.fb{stroke:var(--amber);stroke-width:4;stroke-linecap:round}
.fg{stroke:var(--line);stroke-width:2.5}
.fr{animation-duration:var(--fd);animation-iteration-count:infinite;animation-timing-function:steps(1,end)}
.fr1{animation-name:fka}.fr2{animation-name:fkb}.fr3{animation-name:fkc}
@keyframes fka{0%,24.9%{opacity:1}25%,100%{opacity:0}}
@keyframes fkb{0%,24.9%{opacity:0}25%,49.9%{opacity:1}50%,74.9%{opacity:0}75%,99.9%{opacity:1}100%{opacity:0}}
@keyframes fkc{0%,49.9%{opacity:0}50%,74.9%{opacity:1}75%,100%{opacity:0}}
.cue{font-size:13px;color:var(--muted);line-height:1.6;text-align:center;margin-top:10px;padding:0 4px}
.figbox{margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
.lead{padding:2px 0 6px}
.leadnum{font-size:44px;font-weight:200;letter-spacing:-.04em;margin-top:14px;color:var(--sky)}
@media (prefers-reduced-motion:reduce){.fr{animation:none}.fr1{opacity:1}.fr2,.fr3{opacity:0}}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px}
.wkc{background:none;border:1.5px solid var(--line2);border-radius:10px;padding:11px 1px;
  font-family:inherit;color:var(--muted)}
.wkc b{display:block;font-size:14px;font-weight:600}
.wkc i{display:block;font-style:normal;font-size:9px;margin-top:4px}
.wkc.main{border-color:var(--amber);color:var(--amber)}
.wkc.light{border-color:var(--sky);color:var(--sky)}
.wkc.rest{opacity:.5}
.strk{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:14px 0 10px}
.sd{height:34px;border-radius:9px;border:1.5px solid var(--line2);display:flex;
  align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.sd.on{background:var(--amber);border-color:var(--amber)}
.sd.lt{border-style:dashed}
.sd.rst{border-color:var(--line);opacity:.7}
.saved{margin-top:12px;font-size:12px;color:var(--sky)}
button{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="dawn"></div>
<div id="root"></div>
<script>
"use strict";
var KEY="pushup100", SPAN=100, PUSH=["pushup","negative"];
var DN=["일","월","화","수","목","금","토"];
var LABEL={main:"메인",light:"가벼운 날",rest:"완전 휴식"};
var CYCLE=["main","light","rest"];
var WEEK_DEF=["rest","main","main","light","main","main","main"];
var STAGES=[{to:20,name:"자리 잡기",desc:"짧은 휴식에 적응"},{to:45,name:"볼륨 올리기",desc:"라운드 수를 늘림"},
{to:70,name:"밀도 올리기",desc:"라운드당 개수를 늘림"},{to:100,name:"100 채우기",desc:"한 자리에서 100개"}];
var TA=[[1,15],[20,30],[45,50],[70,75],[100,100]], MA=[[1,6],[20,9],[45,14],[70,19],[100,23]];
var MILES={20:30,45:50,70:75,100:100};
var BOUNDS={row:{s:2,lo:8,hi:20},squat:{s:2,lo:10,hi:40},crunch:{s:2,lo:8,hi:30},plank:{s:5,lo:15,hi:120}};
var NAMES={pushup:"클러스터",negative:"네거티브",squat:"스쿼트",crunch:"크런치",plank:"플랭크",row:"밴드 로우",pullapart:"풀어파트",test:"최대 테스트"};
var RPEN={easy:"가벼움",ok:"알맞음",hard:"버거움",fail:"안 됐음",test:""};
var PERREP={pushup:2.5,negative:6,squat:2.5,crunch:2,row:2.5,pullapart:1.8};

function iso(d){d=d||new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function since(a){return a?Math.floor((new Date(iso())-new Date(a))/864e5):0}
function addD(b,n){var d=new Date(b+"T00:00:00");d.setDate(d.getDate()+n);return iso(d)}
function interp(a,d){if(d<=a[0][0])return a[0][1];for(var i=0;i<a.length-1;i++){var p=a[i],q=a[i+1];
  if(d<=q[0])return p[1]+(q[1]-p[1])*(d-p[0])/(q[0]-p[0])}return a[a.length-1][1]}

var DEF={v:5,startDate:null,maxPushup:6,bestSession:0,totalPush:0,sessions:0,lastSession:null,lastTest:null,
  squat:{reps:15,sets:3},crunch:{reps:12,sets:3},plank:{reps:25,sets:3},row:{reps:12,sets:3},rowOn:false,
  comebackLeft:0,streaks:{},lastChange:null,days:{},today:null,log:[],countOn:true,week:null,autoRest:true};

function migrate(r){var s=Object.assign({},DEF,r||{});
  ["squat","crunch","plank","row"].forEach(function(k){s[k]=Object.assign({},DEF[k],(r&&r[k])||{})});
  s.days=s.days||{};s.streaks=s.streaks||{};s.log=s.log||[];s.v=5;
  if(typeof s.countOn!=="boolean")s.countOn=true;
  if(!Array.isArray(s.week)||s.week.length!==7)s.week=WEEK_DEF.slice();
  if(typeof s.autoRest!=="boolean")s.autoRest=true;
  if(!s.startDate)s.startDate=iso();return s}

var S,U={tab:"today",rest:null,work:null,auto:null,sound:true,err:"",msg:"",testVal:"",paste:"",savedAt:null,focus:null,fig:null};
try{S=migrate(JSON.parse(localStorage.getItem(KEY)))}catch(e){S=migrate(null)}
if(!S.today||S.today.date!==iso())S.today={date:iso(),done:{},rpe:{},run:false,minimal:false,counted:false};
if(S.lastSession&&since(S.lastSession)>=5&&!S.comebackLeft)S.comebackLeft=3;

/* 저장소를 두 군데 씁니다. 하나가 날아가도 다른 하나가 남습니다.
   둘 다 이 아이폰 안이고, 서버로는 아무것도 나가지 않습니다. */
var idb=null;
function idbOpen(){return new Promise(function(res){
  try{var r=indexedDB.open("p100",1);
    r.onupgradeneeded=function(){try{r.result.createObjectStore("kv")}catch(e){}};
    r.onsuccess=function(){idb=r.result;res(idb)};
    r.onerror=function(){res(null)};r.onblocked=function(){res(null)}}catch(e){res(null)}})}
function idbPut(txt){if(!idb)return;
  try{idb.transaction("kv","readwrite").objectStore("kv").put(txt,"state")}catch(e){}}
function idbGet(){return new Promise(function(res){if(!idb)return res(null);
  try{var q=idb.transaction("kv","readonly").objectStore("kv").get("state");
    q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}}catch(e){res(null)}})}

function save(){
  S.ts=Date.now();
  var txt;try{txt=JSON.stringify(S)}catch(e){U.err="기록을 변환하지 못했습니다";return}
  var ok=false;
  try{localStorage.setItem(KEY,txt);ok=true;U.err=""}catch(e){U.err="저장 실패 — "+(e.message||e)}
  idbPut(txt);
  if(ok)U.savedAt=new Date()}

/* 하루 운동이 끝나면 그날짜 스냅샷을 따로 남깁니다. 최근 10일치 보관 */
function snapCount(){var n=0;try{for(var i=0;i<localStorage.length;i++){
  var k=localStorage.key(i);if(k&&k.indexOf(KEY+".d.")===0)n++}}catch(e){}return n}
function snapshot(){
  try{var k=KEY+".d."+iso();
    if(localStorage.getItem(k))return;
    localStorage.setItem(k,JSON.stringify(S));
    var keys=[];for(var i=0;i<localStorage.length;i++){var n=localStorage.key(i);
      if(n&&n.indexOf(KEY+".d.")===0)keys.push(n)}
    keys.sort();while(keys.length>10)localStorage.removeItem(keys.shift());
    U.snapAt=iso()}catch(e){}}

/* 파일로 내보내기 — 아이폰은 공유 시트로 파일 앱에 바로 넣을 수 있습니다 */
function exportFile(){
  var name="pushup100-"+iso()+".json",txt=JSON.stringify(S);
  try{if(navigator.canShare){var f=new File([txt],name,{type:"application/json"});
    if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:name})
      .then(function(){U.msg="파일로 저장했습니다";draw()}).catch(function(){});return}}}catch(e){}
  try{var url=URL.createObjectURL(new Blob([txt],{type:"application/json"}));
    var a=document.createElement("a");a.href=url;a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},1e3);U.msg="파일을 내려받았습니다"}
  catch(e){U.msg="내보내기에 실패했습니다"}}

/* ══ 소리 ══════════════════════════════════════════════
   아이폰은 웹오디오가 측면 무음 스위치에 막힙니다.
   그래서 오실레이터 대신 WAV를 만들어 <audio>로 재생합니다.
   <audio>는 미디어로 취급돼 무음 스위치를 무시합니다. */
function wavData(freq,ms,vol){
  var sr=22050,n=Math.floor(sr*ms/1000),buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  function w(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))}
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,"data");v.setUint32(40,n*2,true);
  for(var i=0;i<n;i++){var t=i/sr,env=Math.min(1,i/120)*Math.min(1,(n-i)/500);
    v.setInt16(44+i*2,Math.round(Math.sin(2*Math.PI*freq*t)*30000*vol*env),true)}
  var by=new Uint8Array(buf),bin="";
  for(var j=0;j<by.length;j++)bin+=String.fromCharCode(by[j]);
  return "data:audio/wav;base64,"+btoa(bin)}

/* 한국어 고유수사 — 운동 개수는 하나 둘 셋으로 세는 게 자연스럽습니다 */
var K1=["","하나","둘","셋","넷","다섯","여섯","일곱","여덟","아홉"];
var K10=["","열","스물","서른","마흔","쉰","예순","일흔","여든","아흔"];

  var per=Math.max(.4,(e.work-4)/e.reps),i=Math.floor((e.work-left-2)/per)+1;
  return Math.max(0,Math.min(e.reps,i))}

/* ══ 계획 ══════════════════════════════════════════════ */
/* 어제부터 거슬러 실제로 운동한 연속 일수 */
function streakDays(){var n=0;
  for(var i=1;i<=20;i++){if((S.days[addD(iso(),-i)]||0)>0)n++;else break}return n}
/* 요일이 아니라 진행 상황으로 정합니다: 5일 연속하면 쉬고, 3일째는 가볍게 */
function autoType(){var st=streakDays();
  return st>=5?"rest":st===2?"light":"main"}
function dayType(){if(S.autoRest===false){var wd=new Date().getDay();
  return (S.week&&S.week[wd])||WEEK_DEF[wd]}return autoType()}
function trainDays(){var w=(S.week||WEEK_DEF),n=0;
  for(var i=0;i<7;i++)if(w[i]!=="rest")n++;return n}
function dayNum(){return Math.max(1,Math.min(SPAN,since(S.startDate)+1))}
function stageIdx(d){for(var i=0;i<STAGES.length;i++)if(d<=STAGES[i].to)return i;return 3}
function isDeload(){return (Math.floor(since(S.startDate)/7)+1)%5===0}
function maxTarget(d){return Math.round(interp(MA,d))}
function toTest(){return Math.max(0,14-since(S.lastTest||S.startDate))}
function cReps(){return Math.max(2,Math.round(S.maxPushup*0.5))}
function cRest(){return S.maxPushup<10?20:S.maxPushup<16?25:S.maxPushup<22?35:50}
function target(day,type){var t=interp(TA,day);if(type==="light")t*=0.6;if(isDeload())t*=0.7;
  if(S.comebackLeft>0)t*=0.6;return Math.max(6,Math.round(t/5)*5)}

function plan(){
  var day=dayNum(),dt=new Date(),wd=dt.getDay(),tt=dayType();
  var info={n:DN[wd],t:tt,l:LABEL[tt]},reps=cReps();
  var cb=S.comebackLeft>0,dl=isDeload(),mn=!!S.today.minimal;
  if(mn)return{info:info,day:day,cb:cb,dl:dl,mn:mn,target:reps,
    items:[{k:"pushup",n:"푸쉬업",u:"회",reps:reps,sets:1,rest:cRest()}]};
  if(info.t==="rest")return{info:info,day:day,cb:cb,dl:dl,mn:mn,target:0,items:[]};
  var tg=target(day,info.t),rounds=Math.max(3,Math.ceil(tg/reps));
  var items=[];
  if(S.rowOn)items.push({k:"pullapart",n:"밴드 풀어파트",u:"회",reps:20,sets:2,rest:30,
    note:"어깨 앞쪽을 지키는 준비운동"});
  items.push({k:"pushup",n:"푸쉬업 클러스터",u:"회",reps:reps,sets:rounds,rest:cRest(),
    note:"짧게 쉬고 바로 다음 라운드 · 총 "+(reps*rounds)+"개"});
  if(S.maxPushup<15&&info.t==="main"&&!cb&&(dt.getDay()===1||dt.getDay()===4))
    items.push({k:"negative",n:"네거티브 푸쉬업",u:"회",reps:5,sets:2,rest:60,note:"5초에 걸쳐 내려오기만"});
  if(S.rowOn&&info.t==="main")items.push({k:"row",n:"밴드 로우",u:"회",reps:S.row.reps,
    sets:S.row.sets,rest:60,note:"미는 만큼 당겨야 어깨가 버팁니다"});
  if(info.t==="main")items.push(
    {k:"squat",n:"맨몸 스쿼트",u:"회",reps:S.squat.reps,sets:S.squat.sets,rest:60},
    {k:"crunch",n:"크런치",u:"회",reps:S.crunch.reps,sets:S.crunch.sets,rest:45},
    {k:"plank",n:"플랭크",u:"초",reps:S.plank.reps,sets:S.plank.sets,rest:45,timed:true});
  return{info:info,day:day,cb:cb,dl:dl,mn:mn,target:tg,items:items}}

/* ══ 기록 ══════════════════════════════════════════════ */
function recordSet(k,reps){
  S.today.done[k]=(S.today.done[k]||0)+1;S.lastSession=iso();
  if(PUSH.indexOf(k)>=0){S.totalPush=(S.totalPush||0)+reps;
    var dt=(S.days[iso()]||0)+reps;S.days[iso()]=dt;
    if(dt>(S.bestSession||0))S.bestSession=dt}
  if(!S.today.counted){S.sessions=(S.sessions||0)+1;S.today.counted=true}
  save()}

/* ══ 전체 자동 진행 ════════════════════════════════════ */
function workSec(it){if(it.timed)return it.reps;
  return Math.max(6,Math.round(it.reps*(PERREP[it.k]||2.5))+4)}

function startAuto(){
  unlock();
  var p=plan(),q=[];
  p.items.forEach(function(it){
    var already=S.today.done[it.k]||0;
    for(var i=already;i<it.sets;i++)q.push({k:it.k,n:it.n,u:it.u,reps:it.reps,idx:i+1,sets:it.sets,
      rest:it.rest,work:workSec(it),timed:!!it.timed,last:i===it.sets-1})});
  if(!q.length)return;
  U.auto={q:q,i:0,phase:"lead",end:Date.now()+5000,paused:false,left:0,ticked:{}};
  holdScreen(true);
  say(q[0].n+", "+q[0].reps+q[0].u+", 준비");
  startTick();draw()}

function autoAdvance(){
  var A=U.auto,e=A.q[A.i];
  if(A.phase==="lead"){A.phase="work";A.end=Date.now()+e.work*1e3;A.ticked={};
    beep("go");say(e.timed?e.reps+"초 유지":"시작");return}
  if(A.phase==="work"){
    recordSet(e.k,e.reps);beep("done");
    if(A.i>=A.q.length-1){finishAuto();return}
    var nx=A.q[A.i+1];
    if(e.last){A.phase="rest";A.end=Date.now()+Math.max(e.rest,30)*1e3;A.ticked={};
      say("좋습니다. 다음은 "+nx.n)}
    else{A.phase="rest";A.end=Date.now()+e.rest*1e3;A.ticked={};
      say("휴식 "+e.rest+"초")}
    return}
  /* rest → 다음 세트 */
  A.i++;A.phase="lead";A.end=Date.now()+5000;A.ticked={};
  var c=A.q[A.i];
  say(c.idx===1?c.n+", "+c.reps+c.u+", 준비":c.idx+(c.k==="pushup"?"라운드":"세트")+", 준비");}

function finishAuto(){
  U.auto=null;holdScreen(false);stopTick();
  beep("end");
  var t=S.days[iso()]||0;
  say("오늘 운동 끝났습니다. 푸쉬업 "+t+"개.");
  draw()}

function stopAuto(){U.auto=null;holdScreen(false);stopTick();draw()}

/* ══ 수동 세트 ═════════════════════════════════════════ */
function completeSet(it){
  unlock();
  var cur=(S.today.done[it.k]||0)+1;
  recordSet(it.k,it.reps);beep("done");
  if(cur<it.sets){U.rest={end:Date.now()+it.rest*1e3,total:it.rest,ten:false,
    say:it.k==="pushup"?(cur+1)+"라운드":it.n+" "+(cur+1)+"세트"};holdScreen(true);startTick()}
  else{beep("end");say(it.n+" 끝났습니다")}
  draw()}

function tapSet(it){unlock();if(U.rest||U.work)return;
  if(it.timed){say(it.reps+"초 유지");U.work={end:Date.now()+it.reps*1e3,total:it.reps,it:it,three:false};
    holdScreen(true);startTick();draw()}
  else completeSet(it)}

function chooseRpe(k,r){unlock();var it=null,p=plan();
  p.items.forEach(function(x){if(x.k===k)it=x});if(!it)return;
  var done=(S.today.done[k]||0)>=it.sets,b=BOUNDS[k],free=p.cb||p.dl||p.mn,bad=!done||r==="fail";
  if(b){var mv=function(d){S[k].reps=Math.min(b.hi,Math.max(b.lo,S[k].reps+d*b.s))};
    if(bad){S.streaks[k]=0;if(!free)mv(-1)}
    else if(r==="hard")S.streaks[k]=0;
    else{var c=(S.streaks[k]||0)+1;if(c>=3){S.streaks[k]=0;mv(1);
      S.lastChange={d:iso(),t:"다음부터 "+NAMES[k]+" "+S[k].reps+(k==="plank"?"초":"회")}}else S.streaks[k]=c}}
  S.today.rpe[k]=r;
  S.log.unshift({d:iso(),k:k,r:it.reps,s:it.sets,done:S.today.done[k]||0,rpe:r});
  S.log=S.log.slice(0,800);save();draw()}

function addExtra(n){unlock();beep("done");S.totalPush=(S.totalPush||0)+n;
  var dt=(S.days[iso()]||0)+n;S.days[iso()]=dt;
  if(dt>(S.bestSession||0))S.bestSession=dt;S.lastSession=iso();save();draw()}

function saveTest(){var v=Math.max(1,Math.min(200,parseInt(U.testVal,10)||0));
  S.maxPushup=v;S.lastTest=iso();
  S.lastChange={d:iso(),t:"클러스터 "+Math.max(2,Math.round(v*.5))+"개로 재조정"};
  S.log.unshift({d:iso(),k:"test",r:v,s:1,done:1,rpe:"test"});S.log=S.log.slice(0,800);
  U.testVal="";save();say(v+"개 기록했습니다");draw()}

/* ══ 타이머 루프 ═══════════════════════════════════════ */
var tickId=null;
function startTick(){if(tickId)return;
  if(keep){try{var kp=keep.play();if(kp&&kp.catch)kp.catch(function(){})}catch(e){}}
  tickId=setInterval(function(){
  var now=Date.now();
  if(U.auto){var A=U.auto;if(A.paused){paintTimer();return}
    var e=A.q[A.i],L=(A.end-now)/1e3,s=Math.ceil(L);
    if(A.phase==="lead"&&s<=3&&s>=1&&!A.ticked[s]){A.ticked[s]=true;beep("tick");
      if(S.countOn)sayNum(knum(s))}
    if(A.phase==="work"){
      if(e.timed){
        if((s===30||s===20||s===10)&&!A.ticked["t"+s]){A.ticked["t"+s]=true;beep("tick");
          if(S.countOn)sayNum(s+"초")}
        if(s<=3&&s>=1&&!A.ticked["w"+s]){A.ticked["w"+s]=true;beep("tick");
          if(S.countOn)sayNum(knum(s))}}
      else{var rp=curRep(e,L);
        if(rp>=1&&!A.ticked["p"+rp]){A.ticked["p"+rp]=true;if(S.countOn)sayNum(knum(rp))}
        if(s<=2&&s>=1&&!A.ticked["w"+s]){A.ticked["w"+s]=true;beep("tick")}}}
    if(A.phase==="rest"){
      if(s===10&&A.end-now>0&&!A.ticked.r10){A.ticked.r10=true;beep("tick");say("10초")}
      if(s<=3&&s>=1&&!A.ticked["c"+s]){A.ticked["c"+s]=true;beep("tick");
        if(S.countOn)sayNum(knum(s))}}
    if(L<=0){autoAdvance();draw();return}
    paintTimer();return}
  if(U.work){var W=(U.work.end-now)/1e3;
    if(W<=3&&!U.work.three){U.work.three=true;beep("tick")}
    if(W<=0){var it=U.work.it;U.work=null;stopTick();completeSet(it);return}}
  else if(U.rest){var R=(U.rest.end-now)/1e3;
    if(R<=10&&U.rest.total>25&&!U.rest.ten){U.rest.ten=true;beep("tick")}
    if(R<=0){var sp=U.rest.say;U.rest=null;beep("go");if(sp)say(sp);stopTick();draw();return}}
  else{stopTick();return}
  paintTimer()},100)}
function stopTick(){if(tickId){clearInterval(tickId);tickId=null}

function paintTimer(){
  var t=U.auto||U.work||U.rest;if(!t)return;
  var total=U.auto?(U.auto.phase==="lead"?5:U.auto.phase==="work"?U.auto.q[U.auto.i].work:
    Math.max(U.auto.q[U.auto.i].rest,U.auto.q[U.auto.i].last?30:0)):t.total;
  var left=U.auto&&U.auto.paused?U.auto.left:Math.max(0,Math.ceil((t.end-Date.now())/1e3));
  var n=document.getElementById("tnum"),ph=document.getElementById("tphase");
  if(U.auto&&U.auto.phase==="work"&&!U.auto.q[U.auto.i].timed){
    var e=U.auto.q[U.auto.i],rp=curRep(e,left);
    if(n)n.textContent=rp||"–";
    if(ph)ph.textContent=rp?rp+" / "+e.reps+e.u:"준비"}
  else if(n)n.textContent=left;
  var c=document.getElementById("tring");
  if(c&&!(U.auto&&U.auto.phase==="lead")){var r=U.auto?96:80,C=2*Math.PI*r;
    c.setAttribute("stroke-dashoffset",C*(1-Math.min(1,left/(total||1))))}}

function esc(x){return String(x).replace(/[&<>"]/g,function(c){

function b(a,v,txt,cls,extra){return '<button class="'+cls+'" data-a="'+a+'"'+

function ring(left,total,r,col){var C=2*Math.PI*r,sz=r*2+12;
  return '<div class="ringwrap" style="width:'+sz+'px;height:'+sz+'px"><svg width="'+sz+'" height="'+sz+'">'+
    '<circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="8"/>'+
    '<circle id="tring" cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="8" '+
    'stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-Math.min(1,left/(total||1))))+'"/></svg>'}

  var counting=A.phase==="work"&&!e.timed,rp=counting?curRep(e,left):0;

  '<div class="card"><div class="cardname">밴드 운동</div><div class="cardsub">'+
    '미는 동작만 매일 쌓으면 견갑골이 앞으로 말립니다. 켜면 풀어파트 20회×2가 준비운동으로, '+
    '밴드 로우 '+S.row.reps+'회×'+S.row.sets+'가 메인 날에 들어갑니다. 밴드가 준비되면 켜세요.</div>'+
    b("row",null,S.rowOn?"루틴에 포함됨":"루틴에 추가하기","toggle"+(S.rowOn?" on":""))+
    '<div class="figbox">'+figSvg("pullapart")+'<div class="cue">'+FIG.pullapart.cue+'</div></div>'+
    '<div class="figbox">'+figSvg("row")+'<div class="cue">'+FIG.row.cue+'</div></div></div>'+
  '<div class="card"><div class="cardname">기록 보관</div>'+
    '<div class="cardsub">저장하는 곳은 이 아이폰 두 군데(브라우저 저장소와 IndexedDB)입니다. '+
    'GitHub에는 앱 코드만 있고 기록은 올라가지 않습니다. 세트를 누를 때마다, 앱을 내릴 때마다 자동 저장됩니다.</div>'+
    '<div class="saved">'+(U.savedAt?"마지막 저장 "+U.savedAt.getHours()+":"+
      ("0"+U.savedAt.getMinutes()).slice(-2):"이번 실행에서 아직 저장 없음")+
      ' · 보관 중인 날짜별 스냅샷 '+snapCount()+'개</div>'+
    '<div class="note">Safari 방문 기록·데이터 지우기를 하거나 폰을 바꾸면 두 저장소가 함께 사라집니다. '+
    '2주에 한 번, 최대 테스트 하는 날 파일로 빼두세요.</div>'+
    b("dl",null,"파일로 저장 (파일 앱 · iCloud)","toggle")+
    '<textarea class="dump" id="ps" placeholder="백업 JSON을 붙여넣고 아래를 누르면 복원됩니다"></textarea>'+
    b("restore",null,"복원하기","toggle")+(U.msg?'<div class="cardsub">'+esc(U.msg)+'</div>':"")+'</div>'+
  '<div class="card"><div class="cardname">05:00 알림</div><div class="cardsub">아이폰은 웹 앱이 예약 알림을 '+
    '못 보냅니다. 러닝 알람은 시계 앱 알람에 매일 반복으로 걸어두세요.</div></div>'}

function draw(){
  var p=plan(),st=stageIdx(p.day);
  var pl=p.items.reduce(function(a,i){return a+i.sets},0),
      fi=p.items.reduce(function(a,i){return a+Math.min(i.sets,S.today.done[i.k]||0)},0);
  document.getElementById("dawn").style.opacity=pl?(fi/pl*0.9):0;
  var h='<div class="head"><div><div class="date">'+p.day+'일차 / '+SPAN+' · '+STAGES[st].name+'</div>'+
    '<div class="daylabel">'+(p.mn?"최소":p.info.l)+'</div></div>'+
    b("snd",null,U.sound?"소리 켜짐":"소리 꺼짐","mute")+'</div>';
  if(U.err)h+='<div class="err">'+esc(U.err)+'</div>';
  if(U.auto)h+=autoView();
  else{h+=timerHtml();
    h+=U.tab==="today"?todayView(p):U.tab==="journey"?journeyView():U.tab==="log"?logView():guideView()}
  if(!U.auto)h+='<div class="tabs">'+[["today","오늘"],["journey","100일"],["log","기록"],["guide","기준"]]
    .map(function(t){return b("tab",t[0],t[1],"tab"+(U.tab===t[0]?" on":""))}).join("")+'</div>';
  document.getElementById("root").innerHTML=h;
  var tv=document.getElementById("tv");
  if(tv){tv.addEventListener("input",function(){U.testVal=this.value;
    var btn=document.querySelector('[data-a="test"]');if(btn)btn.disabled=!this.value});
    if(U.focus==="tv"){tv.focus();tv.setSelectionRange(tv.value.length,tv.value.length)}
    tv.addEventListener("focus",function(){U.focus="tv"});
    tv.addEventListener("blur",function(){U.focus=null})}
  var ps=document.getElementById("ps");
  if(ps){ps.value=U.paste;ps.addEventListener("input",function(){U.paste=this.value})}}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-a]");if(!t)return;
  var a=t.getAttribute("data-a"),v=t.getAttribute("data-v");
  unlock();
  if(a==="tab"){U.tab=v;draw()}
  else if(a==="snd"){U.sound=!U.sound;draw()}
  else if(a==="snd_test"){beep("go");say("바로 나는 소리입니다");
    setTimeout(function(){beep("done");say("3초 뒤 소리입니다. 여기까지 들리면 정상입니다")},3000)}
  else if(a==="astart"){startAuto()}
  else if(a==="anext"){if(U.auto){U.auto.end=Date.now();U.auto.paused=false}}
  else if(a==="apause"){if(U.auto){var A=U.auto;
    if(A.paused){A.end=Date.now()+A.left*1e3;A.paused=false}
    else{A.left=Math.max(0,Math.ceil((A.end-Date.now())/1e3));A.paused=true}draw()}}
  else if(a==="astop"){stopAuto()}
  else if(a==="run"){S.today.run=!S.today.run;save();draw()}
  else if(a==="set"){plan().items.forEach(function(it){if(it.k===v)tapSet(it)})}
  else if(a==="rpe"){var q=v.split(":");chooseRpe(q[0],q[1])}
  else if(a==="add"){addExtra(parseInt(v,10))}
  else if(a==="min"){S.today.minimal=true;save();draw()}
  else if(a==="test"){saveTest()}
  else if(a==="cnt"){S.countOn=!S.countOn;save();
    if(S.countOn){sayNum("하나");setTimeout(function(){sayNum("둘")},900)}draw()}
  else if(a==="fig"){U.fig=U.fig===v?null:v;draw()}
  else if(a==="arest"){S.autoRest=!S.autoRest;save();draw()}
  else if(a==="wk"){var wi=parseInt(v,10),w=(S.week||WEEK_DEF).slice();
    w[wi]=CYCLE[(CYCLE.indexOf(w[wi])+1)%3];S.week=w;save();draw()}
  else if(a==="row"){S.rowOn=!S.rowOn;save();draw()}
  else if(a==="skip"){if(U.work){var it2=U.work.it;U.work=null;stopTick();completeSet(it2)}
    else{U.rest=null;stopTick();draw()}}
  else if(a==="dl"){exportFile();draw()}
  else if(a==="restore"){try{S=migrate(JSON.parse(U.paste));
    if(!S.today||S.today.date!==iso())S.today={date:iso(),done:{},rpe:{},run:false,minimal:false,counted:false};
    U.paste="";U.msg="복원했습니다";save()}catch(err){U.msg="읽을 수 없는 JSON입니다"}draw()}});

document.addEventListener("visibilitychange",function(){
  if(document.hidden){save();return}
  if(!document.hidden){if(S.today.date!==iso()){
    S.today={date:iso(),done:{},rpe:{},run:false,minimal:false,counted:false};save()}
    if(U.auto||U.rest||U.work)paintTimer();draw()}});

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});

/* 브라우저에 "이 데이터는 지우지 말아달라"고 요청합니다 */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){})}catch(e){}

draw();

/* 두 저장소를 비교해 더 최신인 쪽으로 맞춥니다 */
idbOpen().then(idbGet).then(function(txt){
  if(txt){try{var o=JSON.parse(txt);
    if((o.ts||0)>(S.ts||0)){S=migrate(o);
      if(!S.today||S.today.date!==iso())
        S.today={date:iso(),done:{},rpe:{},run:false,minimal:false,counted:false};
      draw()}}catch(e){}}
  try{idbPut(JSON.stringify(S))}catch(e){}});

/* 앱을 내리거나 홈으로 나갈 때 한 번 더 */
window.addEventListener("pagehide",function(){save()});
window.addEventListener("blur",function(){save()});
</script>
</body>
